[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epprint"
version = "1!0.0.1787109858"
description = "print() alias that writes to sys.stderr prepended by stack metadata"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
# Leave dependencies empty - the backend fills this dynamically
dependencies = [
    "eprint @ git+https://github.com/jakeogh/eprint@6ee1deca0c24b684eb5093247d6bd22e11f1b057",
]
requires-python = ">=3.11"

[project.license]
text = "ISC"

[project.urls]
Homepage = "https://github.com/jakeogh/epprint"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
epprint = [
    "py.typed",
]

# Configuration for our custom backend
